<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · ScienceInfra</title>
<meta name="description" content="ScienceInfra builds open analysis libraries that AI agents look up and call — omicverse, matverse, socialverse, physverse and astroverse.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<style>
/* Type scale and spacing measured from x.ai at a 1440px viewport. */
:root{
  color-scheme: dark;
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --btn-dark:#202020;
  --fg:#fff;
  --fg-80:rgba(255,255,255,.8);
  --fg-60:rgba(255,255,255,.6);
  --fg-30:rgba(255,255,255,.3);
  --hair:rgba(255,255,255,.08);
  --sunset:#ff6308;
  --t-muted:#8d867e;
  --t-dim:#59534d;
  --t-text:#f2ede5;
  --t-code:#e1e1e1;
  --t-teal:#29c6be;
  --t-blue:#88a6ff;
  --t-green:#91c17a;
  --t-purple:#bc97ff;
  --t-str:#e8a87c;
  --sans:"Geist",Arial,"PingFang SC",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1232px,calc(100% - 32px));margin:0 auto}

/* ---------- header (x.ai: 64px tall, 13px/500 links, 6px 12px padding) ---------- */
header{position:fixed;inset:0 0 auto;top:env(safe-area-inset-top,0px);z-index:50;transition:background .2s,backdrop-filter .2s}
header.scrolled{background:rgba(10,10,10,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header .wrap{display:flex;align-items:center;height:64px}
.logo{display:flex;align-items:center;color:var(--fg)}
.logo svg{height:20px;width:auto;display:block}
.links{display:flex;margin-left:28px}
.links a{font-size:13px;line-height:19.5px;font-weight:500;padding:6px 12px;color:var(--fg);opacity:.9;transition:opacity .15s}
.links a:hover{opacity:1}
.nav-cta{margin-left:auto;display:flex;align-items:center;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9999px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;transition:background .15s,opacity .15s}
.btn-dark{background:var(--btn-dark);color:var(--fg)}
.btn-dark:hover{background:#2a2a2a}
.btn-light{background:#fff;color:#0a0a0a}
.btn-light:hover{background:#e6e6e6}
.btn-nav{padding:10px 18px;height:40px}
.btn-nav-light{padding:8px 16px;height:36px}
.btn-hero{padding:12px 20px;height:44px}
.btn svg{width:12px;height:12px}

/* ---------- hero (pill y148, h1 60/60 450, sub 18/29.25, buttons 44px) ---------- */
.hero{position:relative;text-align:center;padding-top:148px;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none;
  mask-image:radial-gradient(ellipse 55% 60% at 50% 40%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 55% 60% at 50% 40%,#000 20%,transparent 75%)}
.hero>*{position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:6px 6px 6px 10px;border:1px solid var(--hair);border-radius:9999px;background:rgba(26,26,26,.6);font-size:13px;line-height:19.5px}
.pill .tag{color:var(--sunset);background:rgba(255,99,8,.1);padding:3px 8px;border-radius:9999px;font-size:11px;line-height:11px;font-weight:500}
.pill .strong{font-weight:500}
.pill .muted{color:var(--fg-60)}
.pill .arrow{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.06)}
.pill .arrow svg{width:10px;height:10px}
h1{font-size:60px;line-height:60px;font-weight:450;letter-spacing:-.6px;margin:32px auto 0;max-width:768px}
.typed-slot{display:inline-block;position:relative;text-align:left}
.typed-slot::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:rgba(255,255,255,.2);border-radius:1px}
.caret{display:inline-block;width:2px;height:46px;background:var(--fg);margin-left:3px;vertical-align:-6px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{max-width:768px;margin:20px auto 0;font-size:18px;line-height:29.25px}
.cta{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}

/* ---------- cards (280px tall, 16px radius, #1a1a1a, 12px gap) ---------- */
.cards{margin-top:80px;display:grid;gap:12px;text-align:left}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;display:block;height:280px;background:var(--card);border-radius:16px;overflow:hidden}
.card .stage{position:absolute;inset:0 0 52px;overflow:hidden;
  mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 82%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 82%,transparent 100%)}
.card .foot{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;font-weight:500}
.card .foot .sub{color:var(--fg-30);font-weight:400;font-size:12px;margin-left:8px}
.card .go{display:inline-flex;align-items:center;gap:4px;transition:transform .2s}
.card:hover .go{transform:translateX(2px)}
.badge{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-60);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:9999px}

/* terminal stage: 11px Geist Mono, 1.625 line height */
.term{position:absolute;inset:0;padding:10px 16px 0;font-family:var(--mono);font-size:11px;line-height:17.875px;letter-spacing:-.11px;color:var(--t-code)}
.term .bar{display:flex;align-items:center;gap:6px;color:var(--t-muted);padding:0 0 10px}
.term .bar i{width:8px;height:8px;border-radius:50%;display:inline-block}
.term .bar i:nth-child(1){background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-left:8px}
.term .lines{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.term .ln{white-space:pre;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s}
.term .ln.on{opacity:1;transform:none}
.kw{color:var(--t-purple)}.fn{color:var(--t-blue)}.st{color:var(--t-str)}.cm{color:var(--t-dim)}.ok{color:var(--t-green)}.tl{color:var(--t-teal)}.mu{color:var(--t-muted)}

/* chat stage: 10.5px bubbles */
.chat{position:absolute;inset:0;padding:16px 16px 0}
.chat .msgs{display:flex;flex-direction:column;gap:10px;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.bub{max-width:75%;padding:8px 14px;font-size:10.5px;line-height:17.0625px;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.bub.on{opacity:1;transform:none}
.bub.u{align-self:flex-end;background:rgba(255,255,255,.08);border-radius:16px 16px 6px 16px}
.bub.a{align-self:flex-start;background:rgba(255,255,255,.04);border-radius:16px 16px 16px 6px}
.bub.t{align-self:flex-start;padding:0 2px;font-family:var(--mono);font-size:11px;color:var(--t-muted)}
.bub.t .tl{color:var(--t-teal)}
.bub b{font-weight:600}

/* ---------- section: substrate (eyebrow 14/500, h2 48/48 500) ---------- */
.section{padding-top:120px}
.eyebrow{font-size:14px;line-height:20px;font-weight:500;color:var(--fg-60)}
.h2-xl{font-size:48px;line-height:48px;font-weight:500;letter-spacing:-.48px;margin-top:16px;max-width:568px}
.body16{font-size:16px;line-height:26px;max-width:448px;margin-top:24px}
.substrate{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.substrate .copy{padding-top:24px}
.stats{display:flex;gap:24px;margin-top:40px}
.stats .v{font-size:14px;line-height:20px;font-weight:500}
.stats .k{font-size:12px;line-height:16px;color:var(--fg-30);margin-top:2px}
.orb-card{position:relative;height:420px;background:var(--card);border-radius:16px;overflow:hidden}
.orb-card canvas{position:absolute;inset:0;width:100%;height:100%}
.anatomy{position:absolute;left:16px;bottom:16px;font-family:var(--mono);font-size:11px;line-height:17.875px;letter-spacing:-.11px;color:var(--t-muted)}
.anatomy b{color:var(--t-text);font-weight:400;display:inline-block;width:44px}

/* ---------- section: how it works (h2 30/36 500, h3 16/22 500) ---------- */
.h2{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.3px}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.head-row p{font-size:14px;line-height:20px;color:var(--fg-60);max-width:420px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px}
.tile{background:var(--card);border-radius:16px;padding:16px;height:200px;display:flex;flex-direction:column}
.tile code{font-family:var(--mono);font-size:11px;line-height:17.875px;letter-spacing:-.11px;color:var(--t-muted)}
.tile code .fn{color:var(--t-blue)}
.tile h3{font-size:16px;line-height:22px;font-weight:500;letter-spacing:-.16px;margin-top:auto}
.tile p{font-size:14px;line-height:20px;color:var(--fg-60);margin-top:6px}

/* ---------- closing + footer ---------- */
.closing{padding:120px 0 120px;text-align:center}
.closing .h2{margin-bottom:24px}
footer{border-top:1px solid var(--hair);padding:48px 0 40px}
footer .wrap{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
footer .logo svg{height:20px}
footer .legal{font-size:13px;line-height:21.125px;color:var(--fg-60);margin-top:16px}
.fcols{display:flex;gap:40px;flex-wrap:wrap}
.fcols div{display:flex;flex-direction:column;width:112px}
.fcols h5{font-size:13px;line-height:19.5px;font-weight:500;margin-bottom:6px}
.fcols a,.fcols span{font-size:13px;line-height:21.125px;color:var(--fg);padding:2px 0}
.fcols span{color:var(--fg-30)}
.fcols a:hover{color:var(--fg-60)}

a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ---------- responsive (x.ai mobile: h1 36/39.6, sub 16) ---------- */
@media (max-width:1024px){
  .links a{padding:6px 8px}
  .row3{grid-template-columns:1fr 1fr}
  .row3 .card:last-child{grid-column:span 2}
  .grid4{grid-template-columns:1fr 1fr}
  .substrate{grid-template-columns:1fr}
}
@media (max-width:768px){
  .links{display:none}
  .nav-cta .btn-dark{display:none}
  .hero{padding-top:112px}
  h1{font-size:36px;line-height:39.6px;letter-spacing:-.36px}
  .caret{height:28px;vertical-align:-4px}
  .lede{font-size:16px;line-height:24px}
  .cards{margin-top:56px}
  .row3,.row2,.grid4{grid-template-columns:1fr}
  .row3 .card:last-child{grid-column:auto}
  .h2-xl{font-size:36px;line-height:39.6px}
  .head-row{flex-direction:column;align-items:flex-start}
  .section{padding-top:80px}
  .tile{height:auto;min-height:160px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
